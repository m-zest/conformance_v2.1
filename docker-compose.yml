version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conformance-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPSTREAM_OPENAI_URL=https://api.openai.com/v1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: conformance-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
